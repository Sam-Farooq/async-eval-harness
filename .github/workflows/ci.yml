name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  # The benchmark has to be checked the same way the thing it measures is.
  # An instance whose golden patch does not pass, or whose baseline does,
  # is silently worthless, and nothing else in CI would notice.
  instance-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"

      - name: baseline must fail
        run: |
          if python verify.py --no-patch --out /tmp/baseline.json; then
            echo "::error::baseline passed; the defects do not reproduce"
            exit 1
          fi
          python - <<'PY'
          import json
          r = json.load(open("/tmp/baseline.json"))
          assert r["score"] == 0.0, r
          assert r["pass_to_pass_broken"] == 0, f"pass_to_pass is unstable: {r}"
          print("baseline:", r["score"], r["failure_reason"][:60])
          PY

      - name: golden patch must pass
        run: |
          python verify.py --patch solution.patch --out /tmp/golden.json
          python - <<'PY'
          import json
          r = json.load(open("/tmp/golden.json"))
          assert r["passed"] and r["score"] == 1.0, r
          print("golden:", r["score"], f'{r["runtime_seconds"]}s')
          PY

      - name: a patch that edits the tests must not score
        run: |
          cp tests/test_verifier.py /tmp/orig.py
          sed 's/assert q.completed <= 50.*/assert True/' /tmp/orig.py > /tmp/cheat.py
          diff -u --label a/tests/test_verifier.py --label b/tests/test_verifier.py \
               /tmp/orig.py /tmp/cheat.py > /tmp/cheat.patch || true
          python verify.py --patch /tmp/cheat.patch --out /tmp/cheat.json || true
          python - <<'PY'
          import json
          r = json.load(open("/tmp/cheat.json"))
          assert not r["passed"] and r["score"] == 0.0, f"test tampering scored: {r}"
          print("tampering correctly scored 0.0")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests verify.py

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: the same patch scores the same twice
        run: |
          python verify.py --patch solution.patch --out /tmp/a.json
          python verify.py --patch solution.patch --out /tmp/b.json
          python - <<'PY'
          import json
          a, b = (json.load(open(f"/tmp/{x}.json")) for x in "ab")
          for k in ("passed", "score", "fail_to_pass_resolved", "pass_to_pass_broken"):
              assert a[k] == b[k], f"{k} differs between runs: {a[k]} vs {b[k]}"
          print("deterministic across runs")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t async-eval-harness:ci .
      - name: image runs the baseline as a non-root user
        run: |
          test "$(docker run --rm --entrypoint whoami async-eval-harness:ci)" = runner
          docker run --rm async-eval-harness:ci --no-patch && exit 1 || true
          docker run --rm async-eval-harness:ci --patch solution.patch
