name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  # The benchmark has to be checked the same way the thing it measures is.
  # An instance whose golden patch does not pass, or whose baseline does,
  # is silently worthless and nothing else in CI would notice.
  instance-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"

      - name: baseline must fail
        run: |
          python verify.py --no-patch --out /tmp/baseline.json || true
          python tools/assert_result.py /tmp/baseline.json --score 0.0 --passed false --p2p-broken 0

      - name: golden patch must pass
        run: |
          python verify.py --patch solution.patch --out /tmp/golden.json
          python tools/assert_result.py /tmp/golden.json --score 1.0 --passed true --p2p-broken 0

      - name: solution.patch must match its generator
        run: |
          python tools/make_solution.py
          git diff --exit-code solution.patch

  attacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      # Nine patches that each scored a perfect 1.0 during development.
      - run: python tools/attack_suite.py

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: the same patch scores the same twice
        run: |
          python verify.py --patch solution.patch --out /tmp/a.json
          python verify.py --patch solution.patch --out /tmp/b.json
          python tools/assert_result.py /tmp/a.json --same-as /tmp/b.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests verify.py tools

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t async-eval-harness:ci .
      - name: image runs as a non-root user
        run: test "$(docker run --rm --entrypoint whoami async-eval-harness:ci)" = runner
      - name: baseline fails and the golden patch passes, inside the container
        run: |
          docker run --rm async-eval-harness:ci --no-patch && exit 1 || true
          docker run --rm async-eval-harness:ci --patch solution.patch
