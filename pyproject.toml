[project]
name = "async-eval-harness"
version = "1.0.0"
description = "A reproducible SWE benchmark instance: buggy async task queue, deterministic verifier, golden patch"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "pytest-timeout==2.3.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: excluded from the fast verifier pass"]
# A hung queue is the failure mode under test. Without a hard cap a regression
# stalls the runner instead of failing it.
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"
